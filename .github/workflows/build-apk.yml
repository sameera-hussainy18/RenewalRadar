name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 7.3.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.3.3'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RenewalRadar.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenewalRadar-apk
          path: RenewalRadar.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RenewalRadar build ${{ github.run_number }}
          body: |
            Installable debug APK of RenewalRadar.
            Download **RenewalRadar.apk** below and open it on your Android phone.
          files: RenewalRadar.apk
          make_latest: true
